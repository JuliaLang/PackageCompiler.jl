version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 100
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-updates:
        patterns:
          - "*"
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "julia"

name: CI

on:
  pull_request:
  push:
    branches:
      - 'master'
      - 'release-*'
    tags: '*'
  merge_group: # GitHub Merge Queue

concurrency:
  # Skip intermediate builds: all builds except for builds on the `master` branch
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/master' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  finalize:
    if: always() # this line is important to keep the `finalize` job from being marked as skipped; do not change or delete this line
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ci_started
      - test
      - docs
      - build-mylib
    steps:
      - run: |
          echo ci_started: ${{ needs.ci_started.result }}
          echo test: ${{ needs.test.result }}
          echo docs: ${{ needs.docs.result }}
          echo build-mylib: ${{ needs.build-mylib.result }}
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
  ci_started:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: exit 0
  test:
    # We do not run the full test suite on tags, because we already ran it on master before we made the release.
    # We do build the docs on tags.
    if: (github.event_name != 'push') || (github.ref_type != 'tag')
    timeout-minutes: 150
    name: test (${{ matrix.julia-version }}, ${{ matrix.github-runner }}, ${{ matrix.app-configuration }})
    runs-on: ${{ matrix.github-runner }}
    strategy:
      max-parallel: 20 # leave space for other runs in the JuliaLang org, given these tests are long
      fail-fast: false
      matrix:
        # Avoid a Cartesian product: exercise version compatibility on Linux,
        # and exercise platform/architecture compatibility on current stable.
        include:
          - julia-version: '1.10' # current LTS and minimum supported version
            github-runner: ubuntu-latest
            coverage: 'false'
            app-configuration: default
            extended-tests: none
          - julia-version: '1.12' # current stable
            github-runner: ubuntu-latest
            coverage: 'true'
            app-configuration: filtered
            extended-tests: sysimage
          - julia-version: '1.12'
            github-runner: windows-latest
            coverage: 'false'
            app-configuration: default
            extended-tests: library
          - julia-version: '1.12'
            github-runner: macos-15 # Apple Silicon
            coverage: 'false'
            app-configuration: default
            extended-tests: library
          - julia-version: '1.12'
            github-runner: macos-15-intel
            coverage: 'false'
            app-configuration: incremental
            extended-tests: none
          - julia-version: 'pre'
            github-runner: ubuntu-latest
            coverage: 'false'
            app-configuration: default
            extended-tests: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: julia-actions/setup-julia@5c9647d97b78a5debe5164e9eec09d653d29bd71 # v2.6.1
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ runner.arch }}
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: julia-actions/julia-runtest@678da69444cd5f13d7e674a90cb4f534639a14f9 # v1.11.2
        env:
          PACKAGECOMPILER_TEST_APP_CONFIGURATION: ${{ matrix.app-configuration }}
          PACKAGECOMPILER_TEST_EXTENDED: ${{ matrix.extended-tests }}
        with:
          coverage: ${{ matrix.coverage }}
      - if: matrix.coverage == 'true'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
      - if: matrix.coverage == 'true'
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  docs:
    # We do build the docs on tags.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: julia-actions/setup-julia@5c9647d97b78a5debe5164e9eec09d653d29bd71 # v2.6.1
        with:
          version: '1'
      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
        run: julia --project=docs/ -e 'using Pkg; Pkg.instantiate(); include("docs/make.jl")'
  build-mylib:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Only run 1 of the `build-mylib` job at a time, so that this job doesn't take over
      # too many CI resources, and also to leave space for other runs in the JuliaLang org.
      max-parallel: 1
      fail-fast: false
      matrix:
        julia-version:
          - '1.10' # current LTS
          - '1.12' # current stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: julia-actions/setup-julia@5c9647d97b78a5debe5164e9eec09d653d29bd71 # v2.6.1
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: 'examples/MyLib'
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: 'examples/MyLib/build'
      - run: |
          cd examples/MyLib
          make
      - run: ./examples/MyLib/my_application.out
        env:
          LD_LIBRARY_PATH: 'examples/MyLib/MyLibCompiled/lib'
